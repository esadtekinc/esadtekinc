<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Light Palette Gradients -->
    <linearGradient id="l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="l-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="l-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="l-glow-blue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="l-glow-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="l-scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="l-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <clipPath id="l-left-card-clip">
      <rect x="32" y="32" width="410" height="546" rx="20"/>
    </clipPath>

    <style>
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .text-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 0.8s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="24" fill="url(#l-bg)"/>

  <!-- Ambient Light Gradients -->
  <circle cx="200" cy="150" r="300" fill="url(#l-glow-blue)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,20; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="450" r="350" fill="url(#l-glow-cyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -20,-30; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Border Shimmer -->
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#l-glass-border)" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL: COOL SUNGLASSES EMOJI ================= -->
  <g filter="url(#l-shadow)">
    <!-- Glass Panel Background -->
    <rect x="32" y="32" width="410" height="546" rx="20" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="32" y="32" width="410" height="546" rx="20" fill="none" stroke="url(#l-glass-border)" stroke-width="1"/>

    <!-- Floating Container -->
    <g clip-path="url(#l-left-card-clip)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" ease="sine-in-out"/>
        
        <!-- Header Controls -->
        <circle cx="56" cy="56" r="5" fill="#EF4444" opacity="0.8"/>
        <circle cx="72" cy="56" r="5" fill="#F59E0B" opacity="0.8"/>
        <circle cx="88" cy="56" r="5" fill="#10B981" opacity="0.8"/>
        <text x="390" y="60" class="text-code" font-size="11" fill="#94A3B8" text-anchor="end">cool_emoji.svg</text>

        <!-- VECTOR SUNGLASSES EMOJI 😎 -->
        <g transform="translate(237, 200)">
          <!-- Outer Tech Ring HUD Animation -->
          <circle cx="0" cy="0" r="95" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="8,16" opacity="0.4">
            <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="25s" repeatCount="indefinite"/>
          </circle>

          <!-- Emoji Face Base -->
          <circle cx="0" cy="0" r="80" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#l-accent)" stroke-width="3"/>

          <!-- Dark Sunglasses Frame -->
          <!-- Bridge -->
          <rect x="-10" y="-22" width="20" height="6" rx="3" fill="url(#l-accent)"/>
          
          <!-- Left Lens Frame -->
          <path d="M -54 -30 C -12 -30, -8 -30, -6 -20 C -4 -2, -18 12, -32 12 C -50 12, -56 -2, -56 -18 Z" fill="#0F172A" stroke="url(#l-accent)" stroke-width="2.5"/>
          
          <!-- Right Lens Frame -->
          <path d="M 54 -30 C 12 -30, 8 -30, 6 -20 C 4 -2, 18 12, 32 12 C 50 12, 56 -2, 56 -18 Z" fill="#0F172A" stroke="url(#l-accent)" stroke-width="2.5"/>

          <!-- Lens Glass Reflections / Glare -->
          <path d="M -48 -24 L -30 -24 L -42 4 L -50 4 Z" fill="#0284C7" opacity="0.4"/>
          <path d="M -26 -24 L -14 -24 L -22 -2 L -30 -2 Z" fill="#0284C7" opacity="0.2"/>
          
          <path d="M 14 -24 L 32 -24 L 20 4 L 12 4 Z" fill="#0284C7" opacity="0.4"/>
          <path d="M 36 -24 L 48 -24 L 40 -2 L 32 -2 Z" fill="#0284C7" opacity="0.2"/>

          <!-- Cool Confident Smirk Smile -->
          <path d="M -30 25 Q 0 45 30 25" fill="none" stroke="url(#l-accent)" stroke-width="4.5" stroke-linecap="round"/>
          <!-- Dimple curve -->
          <path d="M 28 21 Q 34 26 31 31" fill="none" stroke="url(#l-accent)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- System Stats Below Portrait -->
        <g class="text-code" font-size="11" fill="#475569" transform="translate(60, 345)">
          <text x="0" y="0" fill="#0284C7">&gt; SYSTEM.IDENTITY</text>
          <text x="0" y="22" fill="#0F172A" font-weight="bold">Esad Tekin</text>
          
          <text x="0" y="52" fill="#0284C7">&gt; STATUS</text>
          <text x="0" y="74" fill="#059669">● ONLINE <tspan fill="#94A3B8">[BUILDING MATRIX]</tspan></text>

          <text x="0" y="104" fill="#0284C7">&gt; SYSTEM.LOC</text>
          <text x="0" y="126" fill="#0F172A">Eskişehir / Istanbul, TR</text>
        </g>

        <!-- Animated Scanline -->
        <rect x="32" y="32" width="410" height="80" fill="url(#l-scanline)">
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,470; 0,0" dur="4s" repeatCount="indefinite" ease="linear"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: TERMINAL WINDOW ================= -->
  <g filter="url(#l-shadow)">
    <!-- Glass Panel Background -->
    <rect x="466" y="32" width="682" height="546" rx="20" fill="#F8FAFC" fill-opacity="0.85"/>
    <rect x="466" y="32" width="682" height="546" rx="20" fill="none" stroke="url(#l-glass-border)" stroke-width="1"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 466 52 Q 466 32 486 32 L 1128 32 Q 1148 32 1148 52 L 1148 120 L 466 200 Z" fill="#ffffff" fill-opacity="0.5"/>

    <g transform="translate(506, 60)">
      <!-- Top Prompt Bar -->
      <g class="text-code" font-size="12">
        <text x="0" y="20" fill="#059669">guest@esadtekin</text>
        <text x="125" y="20" fill="#94A3B8">:</text>
        <text x="135" y="20" fill="#0284C7">~/developer</text>
        <text x="225" y="20" fill="#64748B">$ cat profile.json</text>
      </g>

      <!-- Main Greeting Header -->
      <g transform="translate(0, 65)">
        <text x="0" y="0" class="text-sans" font-size="18" font-weight="600" fill="#0284C7">Hi 👋, I'm</text>
        <text x="0" y="42" class="text-sans" font-size="40" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Esad Tekin</text>
      </g>

      <!-- Dynamic Typing Role Container -->
      <g transform="translate(0, 150)">
        <rect x="0" y="-22" width="602" height="36" rx="8" fill="#E2E8F0" fill-opacity="0.6"/>
        <text x="14" y="2" class="text-code" font-size="15" fill="#2563EB" font-weight="bold">&gt;</text>
        
        <!-- Animated Cycling Roles -->
        <g class="text-code" font-size="15" font-weight="500">
          <g>
            <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" dur="12s" repeatCount="indefinite" keyTimes="0;0.22;0.25;0.97;0.98;0.99;1;1"/>
            <text x="32" y="2" fill="#2563EB">Data Scientist &amp; AI Enthusiast</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.28;0.47;0.50;0.99;1;1"/>
            <text x="32" y="2" fill="#059669">Machine Learning &amp; Neural Networks</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.53;0.72;0.75;0.99;1;1"/>
            <text x="32" y="2" fill="#D97706">Full Stack Developer &amp; Open Source</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.78;0.95;0.98;0.99;1;1"/>
            <text x="32" y="2" fill="#DB2777">Statistics @ Eskişehir Osmangazi Univ.</text>
          </g>
        </g>

        <!-- Blinking Cursor -->
        <rect x="365" y="-14" width="8" height="18" fill="#2563EB" class="cursor"/>
      </g>

      <!-- Details List -->
      <g transform="translate(0, 215)" class="text-sans" font-size="13.5">
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#64748B">Education</text>
          <text x="120" y="0" fill="#0F172A" font-weight="500">Statistics, Eskişehir Osmangazi University</text>
        </g>
        <g transform="translate(0, 28)">
          <text x="0" y="0" fill="#64748B">Current Focus</text>
          <text x="120" y="0" fill="#0F172A" font-weight="500">Deep Learning &amp; Predictive Analytics</text>
        </g>
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#64748B">Upcoming</text>
          <text x="120" y="0" fill="#0284C7" font-weight="500">Erasmus @ Università degli Studi del Sannio (Italy)</text>
        </g>
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#64748B">Location</text>
          <text x="120" y="0" fill="#0F172A" font-weight="500">Eskişehir / Istanbul, Türkiye 🇹🇷</text>
        </g>
      </g>

      <!-- Skills Glow Pills -->
      <g transform="translate(0, 335)">
        <text x="0" y="0" class="text-sans" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">STACK &amp; TECHNOLOGIES</text>
        
        <g transform="translate(0, 15)">
          <g transform="translate(0, 0)">
            <rect width="72" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="36" y="17" class="text-sans" font-size="11" font-weight="600" fill="#0284C7" text-anchor="middle">Python</text>
          </g>
          <g transform="translate(80, 0)">
            <rect width="68" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="34" y="17" class="text-sans" font-size="11" font-weight="600" fill="#EE4C2C" text-anchor="middle">PyTorch</text>
          </g>
          <g transform="translate(156, 0)">
            <rect width="90" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="45" y="17" class="text-sans" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">TypeScript</text>
          </g>
          <g transform="translate(254, 0)">
            <rect width="52" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="26" y="17" class="text-sans" font-size="11" font-weight="600" fill="#BE185D" text-anchor="middle">C++</text>
          </g>
          <g transform="translate(314, 0)">
            <rect width="64" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="32" y="17" class="text-sans" font-size="11" font-weight="600" fill="#0284C7" text-anchor="middle">React</text>
          </g>
          <g transform="translate(386, 0)">
            <rect width="84" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="42" y="17" class="text-sans" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">PostgreSQL</text>
          </g>
          <g transform="translate(478, 0)">
            <rect width="95" height="26" rx="13" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
            <text x="47.5" y="17" class="text-sans" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">Scikit-Learn</text>
          </g>
        </g>
      </g>

      <!-- Social Links Bar -->
      <g transform="translate(0, 420)">
        <line x1="0" y1="0" x2="602" y2="0" stroke="#CBD5E1" stroke-width="1"/>
        
        <g transform="translate(0, 18)">
          <circle cx="12" cy="12" r="12" fill="#E2E8F0"/>
          <path d="M12 5C8.13 5 5 8.13 5 12c0 3.09 2 5.71 4.77 6.63.35.06.48-.15.48-.34 0-.17-.01-.62-.01-1.21-1.95.42-2.36-.94-2.36-.94-.32-.81-.78-1.03-.78-1.03-.64-.44.05-.43.05-.43.71.05 1.08.73 1.08.73.63 1.08 1.65.77 2.05.59.06-.46.25-.77.45-.95-1.56-.18-3.2-.78-3.2-3.47 0-.77.28-1.4.73-1.89-.07-.18-.32-.89.07-1.86 0 0 .59-.19 1.93.72.56-.16 1.16-.24 1.76-.24.6 0 1.2.08 1.76.24 1.34-.91 1.93-.72 1.93-.72.39.97.14 1.68.07 1.86.46.49.73 1.12.73 1.89 0 2.7-1.65 3.29-3.22 3.47.26.22.49.66.49 1.34 0 .97-.01 1.75-.01 1.99 0 .19.13.41.48.34C17 17.71 19 15.09 19 12c0-3.87-3.13-7-7-7z" fill="#0F172A"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#475569">GitHub</text>
        </g>

        <g transform="translate(120, 18)">
          <circle cx="12" cy="12" r="12" fill="#E2E8F0"/>
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.47 1.47 0 1 0 0 2.94 1.47 1.47 0 0 0 0-2.94z" fill="#0284C7"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#475569">LinkedIn</text>
        </g>

        <g transform="translate(240, 18)">
          <circle cx="12" cy="12" r="12" fill="#E2E8F0"/>
          <circle cx="12" cy="12" r="6" fill="none" stroke="#059669" stroke-width="1.5"/>
          <path d="M12 6a9 9 0 0 0 0 12M6 12h12" stroke="#059669" stroke-width="1.5"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#475569">Portfolio</text>
        </g>
      </g>
    </g>
  </g>
</svg>
