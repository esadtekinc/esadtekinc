<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Dark Palette -->
    <linearGradient id="d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>

    <linearGradient id="d-orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF3300"/>
    </linearGradient>

    <linearGradient id="d-glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="d-orange-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters & Shadows -->
    <filter id="d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="d-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <clipPath id="left-card-clip">
      <rect x="32" y="32" width="410" height="546" rx="16"/>
    </clipPath>

    <style>
      .text-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .text-sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 0.8s infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="20" fill="url(#d-bg)"/>

  <!-- Subtle Ambient Orange Light -->
  <circle cx="200" cy="180" r="320" fill="url(#d-orange-glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 25,20; 0,0" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1178" height="608" rx="19" fill="none" stroke="url(#d-glass-border)" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL: ARTISANAL 😎 EMOJI ================= -->
  <g filter="url(#d-shadow)">
    <rect x="32" y="32" width="410" height="546" rx="16" fill="#141417" fill-opacity="0.75"/>
    <rect x="32" y="32" width="410" height="546" rx="16" fill="none" stroke="url(#d-glass-border)" stroke-width="1"/>

    <g clip-path="url(#left-card-clip)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="6s" repeatCount="indefinite" ease="sine-in-out"/>
        
        <!-- Window Controls -->
        <circle cx="56" cy="56" r="4.5" fill="#FF5500"/>
        <circle cx="70" cy="56" r="4.5" fill="#3A3A40"/>
        <circle cx="84" cy="56" r="4.5" fill="#2A2A30"/>
        <text x="390" y="60" class="text-code" font-size="11" fill="#71717A" text-anchor="end">profile.avatar</text>

        <!-- Minimalist High-End Sunglasses Emoji 😎 -->
        <g transform="translate(237, 200)">
          <!-- Outer Tech HUD Ring -->
          <circle cx="0" cy="0" r="88" fill="none" stroke="#FF5500" stroke-width="1" stroke-dasharray="4,8" opacity="0.35">
            <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="30s" repeatCount="indefinite"/>
          </circle>
          
          <!-- Base Face Circle -->
          <circle cx="0" cy="0" r="76" fill="#1A1A1E" stroke="url(#d-orange-grad)" stroke-width="2.5" filter="url(#d-glow)"/>

          <!-- Eyebrows / Expression Lines -->
          <path d="M -42 -28 Q -28 -34 -14 -28" fill="none" stroke="#FF5500" stroke-width="3" stroke-linecap="round"/>
          <path d="M 14 -28 Q 28 -34 42 -28" fill="none" stroke="#FF5500" stroke-width="3" stroke-linecap="round"/>

          <!-- Glasses Bridge -->
          <rect x="-10" y="-14" width="20" height="4" rx="2" fill="#F5F0E6"/>

          <!-- Left Lens -->
          <path d="M -50 -20 L -8 -20 Q -6 0 -18 10 Q -38 12 -48 0 Z" fill="#0A0A0B" stroke="#F5F0E6" stroke-width="2"/>
          <!-- Right Lens -->
          <path d="M 8 -20 L 50 -20 Q 48 0 38 10 Q 18 12 6 0 Z" fill="#0A0A0B" stroke="#F5F0E6" stroke-width="2"/>

          <!-- Cream Lens Glare / Reflections -->
          <path d="M -44 -16 L -28 -16 L -36 2 L -44 2 Z" fill="#F5F0E6" opacity="0.75"/>
          <path d="M -24 -16 L -16 -16 L -21 -2 L -26 -2 Z" fill="#F5F0E6" opacity="0.4"/>
          
          <path d="M 14 -16 L 30 -16 L 22 2 L 14 2 Z" fill="#F5F0E6" opacity="0.75"/>
          <path d="M 34 -16 L 42 -16 L 37 -2 L 32 -2 Z" fill="#F5F0E6" opacity="0.4"/>

          <!-- Confident Smirk Smile -->
          <path d="M -26 26 Q 0 42 28 24" fill="none" stroke="#FF5500" stroke-width="4" stroke-linecap="round" filter="url(#d-glow)"/>
          <path d="M 25 20 Q 30 25 27 29" fill="none" stroke="#FF5500" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- System Stats / Technical Info -->
        <g class="text-code" font-size="11" fill="#A1A1AA" transform="translate(60, 345)">
          <text x="0" y="0" fill="#FF5500">&gt; SYSTEM.IDENTITY</text>
          <text x="0" y="22" fill="#F5F0E6" font-weight="bold" font-size="13">Esad Tekin</text>
          
          <text x="0" y="55" fill="#FF5500">&gt; STATUS</text>
          <text x="0" y="77" fill="#F5F0E6">● ONLINE <tspan fill="#71717A">[ACTIVE MATRIX]</tspan></text>

          <text x="0" y="110" fill="#FF5500">&gt; LOCATION</text>
          <text x="0" y="132" fill="#F5F0E6">Eskişehir / Istanbul, TR</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: TERMINAL WINDOW ================= -->
  <g filter="url(#d-shadow)">
    <rect x="466" y="32" width="682" height="546" rx="16" fill="#141417" fill-opacity="0.8"/>
    <rect x="466" y="32" width="682" height="546" rx="16" fill="none" stroke="url(#d-glass-border)" stroke-width="1"/>

    <g transform="translate(506, 60)">
      <!-- Top Prompt Bar -->
      <g class="text-code" font-size="12">
        <text x="0" y="20" fill="#FF5500">esadtekin</text>
        <text x="75" y="20" fill="#71717A">:</text>
        <text x="85" y="20" fill="#F5F0E6">~/workspace</text>
        <text x="180" y="20" fill="#71717A">$ cat profile.json</text>
      </g>

      <!-- Main Greeting Header -->
      <g transform="translate(0, 65)">
        <text x="0" y="0" class="text-sans" font-size="18" font-weight="600" fill="#FF5500">Hi 👋, I'm</text>
        <text x="0" y="42" class="text-sans" font-size="42" font-weight="800" fill="#F5F0E6" letter-spacing="-0.5">Esad Tekin</text>
      </g>

      <!-- Dynamic Typing Role Container -->
      <g transform="translate(0, 150)">
        <rect x="0" y="-22" width="602" height="36" rx="6" fill="#0A0A0B" fill-opacity="0.6" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="2" class="text-code" font-size="15" fill="#FF5500" font-weight="bold">&gt;</text>
        
        <!-- Animated Cycling Roles -->
        <g class="text-code" font-size="14" font-weight="500">
          <g>
            <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" dur="12s" repeatCount="indefinite" keyTimes="0;0.22;0.25;0.97;0.98;0.99;1;1"/>
            <text x="32" y="2" fill="#F5F0E6">Data Scientist &amp; AI Enthusiast</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.28;0.47;0.50;0.99;1;1"/>
            <text x="32" y="2" fill="#FF5500">Machine Learning &amp; Neural Networks</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.53;0.72;0.75;0.99;1;1"/>
            <text x="32" y="2" fill="#F5F0E6">Full Stack Developer &amp; Open Source</text>
          </g>
          <g>
            <animate attributeName="opacity" values="0;0;0;0;0;0;1;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.78;0.95;0.98;0.99;1;1"/>
            <text x="32" y="2" fill="#FF5500">Statistics @ Eskişehir Osmangazi Univ.</text>
          </g>
        </g>

        <!-- Blinking Cursor -->
        <rect x="365" y="-14" width="8" height="18" fill="#FF5500" class="cursor"/>
      </g>

      <!-- Details List -->
      <g transform="translate(0, 215)" class="text-sans" font-size="13.5">
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#71717A">Education</text>
          <text x="120" y="0" fill="#F5F0E6" font-weight="500">Statistics, Eskişehir Osmangazi University</text>
        </g>
        <g transform="translate(0, 28)">
          <text x="0" y="0" fill="#71717A">Current Focus</text>
          <text x="120" y="0" fill="#F5F0E6" font-weight="500">Deep Learning &amp; Predictive Analytics</text>
        </g>
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#71717A">Upcoming</text>
          <text x="120" y="0" fill="#FF5500" font-weight="500">Erasmus @ Università degli Studi del Sannio (Italy)</text>
        </g>
        <g transform="translate(0, 84)">
          <text x="0" y="0" fill="#71717A">Location</text>
          <text x="120" y="0" fill="#F5F0E6" font-weight="500">Eskişehir / Istanbul, Türkiye 🇹🇷</text>
        </g>
      </g>

      <!-- Skills Pills -->
      <g transform="translate(0, 335)">
        <text x="0" y="0" class="text-sans" font-size="11" font-weight="700" fill="#71717A" letter-spacing="1">STACK &amp; TECHNOLOGIES</text>
        
        <g transform="translate(0, 15)">
          <g transform="translate(0, 0)">
            <rect width="72" height="26" rx="13" fill="#1A1A1E" stroke="#FF5500" stroke-width="1"/>
            <text x="36" y="17" class="text-sans" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">Python</text>
          </g>
          <g transform="translate(80, 0)">
            <rect width="70" height="26" rx="13" fill="#FF5500"/>
            <text x="35" y="17" class="text-sans" font-size="11" font-weight="700" fill="#0A0A0B" text-anchor="middle">PyTorch</text>
          </g>
          <g transform="translate(158, 0)">
            <rect width="90" height="26" rx="13" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
            <text x="45" y="17" class="text-sans" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">TypeScript</text>
          </g>
          <g transform="translate(256, 0)">
            <rect width="52" height="26" rx="13" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
            <text x="26" y="17" class="text-sans" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">C++</text>
          </g>
          <g transform="translate(316, 0)">
            <rect width="64" height="26" rx="13" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
            <text x="32" y="17" class="text-sans" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">React</text>
          </g>
          <g transform="translate(388, 0)">
            <rect width="86" height="26" rx="13" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
            <text x="43" y="17" class="text-sans" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">PostgreSQL</text>
          </g>
          <g transform="translate(482, 0)">
            <rect width="95" height="26" rx="13" fill="#1A1A1E" stroke="#FF5500" stroke-width="1"/>
            <text x="47.5" y="17" class="text-sans" font-size="11" font-weight="600" fill="#FF5500" text-anchor="middle">Scikit-Learn</text>
          </g>
        </g>
      </g>

      <!-- Social Links Bar -->
      <g transform="translate(0, 420)">
        <line x1="0" y1="0" x2="602" y2="0" stroke="#27272A" stroke-width="1"/>
        
        <g transform="translate(0, 18)">
          <circle cx="12" cy="12" r="12" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
          <path d="M12 5C8.13 5 5 8.13 5 12c0 3.09 2 5.71 4.77 6.63.35.06.48-.15.48-.34 0-.17-.01-.62-.01-1.21-1.95.42-2.36-.94-2.36-.94-.32-.81-.78-1.03-.78-1.03-.64-.44.05-.43.05-.43.71.05 1.08.73 1.08.73.63 1.08 1.65.77 2.05.59.06-.46.25-.77.45-.95-1.56-.18-3.2-.78-3.2-3.47 0-.77.28-1.4.73-1.89-.07-.18-.32-.89.07-1.86 0 0 .59-.19 1.93.72.56-.16 1.16-.24 1.76-.24.6 0 1.2.08 1.76.24 1.34-.91 1.93-.72 1.93-.72.39.97.14 1.68.07 1.86.46.49.73 1.12.73 1.89 0 2.7-1.65 3.29-3.22 3.47.26.22.49.66.49 1.34 0 .97-.01 1.75-.01 1.99 0 .19.13.41.48.34C17 17.71 19 15.09 19 12c0-3.87-3.13-7-7-7z" fill="#F5F0E6"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#A1A1AA">GitHub</text>
        </g>

        <g transform="translate(120, 18)">
          <circle cx="12" cy="12" r="12" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.47 1.47 0 1 0 0 2.94 1.47 1.47 0 0 0 0-2.94z" fill="#FF5500"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#A1A1AA">LinkedIn</text>
        </g>

        <g transform="translate(240, 18)">
          <circle cx="12" cy="12" r="12" fill="#1A1A1E" stroke="#3F3F46" stroke-width="1"/>
          <circle cx="12" cy="12" r="6" fill="none" stroke="#F5F0E6" stroke-width="1.5"/>
          <path d="M12 6a9 9 0 0 0 0 12M6 12h12" stroke="#F5F0E6" stroke-width="1.5"/>
          <text x="32" y="16" class="text-sans" font-size="12" font-weight="600" fill="#A1A1AA">Portfolio</text>
        </g>
      </g>
    </g>
  </g>
</svg>
